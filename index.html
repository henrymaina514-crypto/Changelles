  <script>
    // Helper to capture console.log into a string
    function captureOutput(fn) {
      let output = "";
      const originalLog = console.log;
      console.log = (...args) => {
        output += args.join(" ") + "\n";
        originalLog(...args); // still show in real console
      };
      fn();
      console.log = originalLog;
      return output;
    }

    // ========== CHALLENGE 1 ==========
    document.getElementById("output1").textContent = captureOutput(() => {
      // Count from 1 to 30 and shout Chai / Mandazi based on multiples
      let chaiMandaziCount = 0;

      for (let i = 1; i <= 30; i++) {
        if (i % 3 === 0 && i % 5 === 0) {
          console.log("Chai & Mandazi");
          chaiMandaziCount++;
        } else if (i % 3 === 0) {
          console.log("Chai");
        } else if (i % 5 === 0) {
          console.log("Mandazi");
        } else {
          console.log(i);
        }
      }

      // Bonus
      console.log("Chai & Mandazi was shouted " + chaiMandaziCount + " times");
    });

    // ========== CHALLENGE 2 ==========
    document.getElementById("output2").textContent = captureOutput(() => {
      // Calculate how many months to save KES 5000
      let goal = 5000;
      let month = 1;
      let saving = 100;
      let total = 0;

      while (total < goal) {
        total += saving;

        let line = Month ${month}: saved KES ${saving}, total KES ${total};
        if (saving >= 500) {
          line += " - Big month!";
        }
        console.log(line);

        // Safety net (bonus)
        if (month >= 24) {
          console.log("Stopped at month 24 for safety");
          break;
        }

        month++;
        saving += 50;
      }

      console.log(Goal reached in month ${month - 1} with KES ${total}!);
    });
